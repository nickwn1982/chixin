<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><script src="../env.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="robots" content="noindex,nofollow">
<title>我的入口｜巴拿巴宣教學院募款</title>
<style>
  :root { --red:#a8321f; --red-d:#7f2416; --cream:#fbf6ec; --ink:#2e2a26; --mute:#7a7168; --line:#e4d8c4; --green:#2f6b4f; --gold:#c8963e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; font-size:18px; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 48px; }
  header { background:var(--red); color:#fff; padding:20px 16px 16px; text-align:center; border-bottom:5px solid var(--gold); }
  header .sub { font-size:14px; opacity:.92; letter-spacing:.08em; }
  header h1 { margin:4px 0 0; font-size:24px; line-height:1.3; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; }
  .card h2 { font-size:18px; margin:0 0 10px; color:var(--red-d); }
  label.f { display:block; font-weight:700; margin:12px 0 4px; }
  label.f:first-of-type { margin-top:0; }
  label.f small { font-weight:400; color:var(--mute); }
  input[type=text], input[type=password], input[type=tel], select { width:100%; font:inherit; padding:12px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, select:focus, button:focus-visible, a:focus-visible { outline:3px solid #e9b949; outline-offset:1px; }
  .btn { display:block; width:100%; font:inherit; font-size:20px; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--red); color:#fff; cursor:pointer; margin-top:16px; text-align:center; text-decoration:none; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--green); border:2px solid var(--green); }
  .btn.small { font-size:16px; padding:9px 12px; margin-top:8px; display:inline-block; width:auto; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; min-width:0; }
  .ok { background:#dcefe2; color:#17472f; border-radius:10px; padding:10px 14px; margin-top:12px; font-weight:700; }
  #acct summary { cursor:pointer; font-weight:700; color:var(--green); padding:6px 0; }
  .err { background:#fdecea; border:2px solid #e2a79e; color:#8a1f10; border-radius:10px; padding:10px 14px; margin-top:12px; font-weight:700; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:16px; color:var(--mute); }
  .chk input { width:22px; height:22px; accent-color:var(--red); }
  .hint { font-size:14px; color:var(--mute); }
  .hello { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .hello b { font-size:21px; }
  .link { background:none; border:0; color:var(--mute); text-decoration:underline; font:inherit; font-size:15px; cursor:pointer; padding:6px; }
  .tot { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .tot div { background:#faf5ea; border-radius:10px; padding:8px 10px; }
  .tot small { display:block; color:var(--mute); font-size:13px; }
  .tot b { font-size:21px; font-variant-numeric:tabular-nums; }
  .tot .g b { color:var(--green); } .tot .r b { color:var(--red); }
  .tabs { display:flex; gap:6px; margin-top:14px; }
  .tabs button { flex:1; font:inherit; font-size:15px; font-weight:700; padding:8px 4px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--mute); cursor:pointer; line-height:1.3; }
  .tabs button small { display:block; font-weight:400; font-size:12px; }
  .tabs button[aria-selected=true] { border-color:var(--red); color:var(--red-d); background:#fff4f0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px; }
  .chips button { font:inherit; font-size:14px; padding:4px 12px; border:1.5px solid var(--line); border-radius:99px; background:#fff; color:var(--mute); cursor:pointer; }
  .chips button[aria-pressed=true] { background:var(--green); border-color:var(--green); color:#fff; }
  .ord { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:16px; background:#fff; }
  .ord.x { opacity:.55; background:#f6f2ea; }
  .ord .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .ord .top b { font-size:19px; }
  .ord .amt { font-weight:700; color:var(--red-d); font-size:19px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ord .meta { color:var(--mute); font-size:14px; }
  .ord a.tel { color:var(--green); font-weight:700; }
  .tag { display:inline-block; font-size:13px; border-radius:99px; padding:1px 10px; margin:6px 4px 0 0; background:#eee; color:#555; }
  .tag.ok { background:#dcefe2; color:#17472f; } .tag.no { background:#fde3e3; color:#8a1c1c; }
  .linkbox { word-break:break-all; background:#f6f1e6; border-radius:10px; padding:8px 10px; font-size:14px; margin-top:6px; }
  .lk h3 { margin:12px 0 0; font-size:17px; }
  .loading { text-align:center; padding:36px 0; color:var(--mute); }
  .spin { width:36px; height:36px; margin:0 auto 10px; border:4px solid var(--line); border-top-color:var(--red); border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  [hidden] { display:none !important; }
  .sq .oline { display:flex; gap:6px; margin-top:8px; } .sq .oline input, .sq .oline select { flex:1; min-width:0; font-size:16px; padding:10px; border:1px solid #d8cdb8; border-radius:10px; }
  .sq > select { margin-top:6px; }
  .tq h3 { font-size:17px; margin:16px 0 6px; } .tq .tq-t, .tq .tq-row { background:#fff; border:1px solid #e4d8c4; border-radius:12px; padding:10px; margin-top:8px; }
  .tq .top { display:flex; justify-content:space-between; gap:8px; } .tq .amt { color:var(--red-d); font-size:15px; }
  .tq .tq-acct { margin:6px 0; font-size:16px; word-break:break-all; } .tq .tq-open { margin-top:6px; }
  .tq input, .tq select { display:block; width:100%; box-sizing:border-box; font-size:16px; padding:10px; border:1px solid #d8cdb8; border-radius:10px; margin-top:8px; }
  .tq .oline { display:flex; gap:6px; } .tq .oline input { flex:1; min-width:0; }
  .tq .tq-send, .tq .tq-save { margin-top:8px; width:100%; } .tq .tag { margin-left:6px; }
  .tq summary { cursor:pointer; font-weight:700; color:#2f6b4f; margin-top:16px; padding:6px 0; }
  .tq-tbl { width:100%; border-collapse:collapse; font-size:15px; margin-top:8px; } .tq-tbl th, .tq-tbl td { border-bottom:1px solid #e4d8c4; padding:6px 4px; text-align:right; }
  .hc-f { display:flex; gap:8px; background:#fff; border:1px solid #e4d8c4; border-radius:10px; padding:8px 10px; margin-top:6px; font-size:15px; } .hc-f small { display:block; color:#7a7168; font-size:13px; }
  .hc-f.lv-error { border-left:4px solid #a8321f; } .hc-f.lv-warn { border-left:4px solid #c8963e; } .hc-ok { color:#2f6b4f; font-weight:700; } .hc .hc-go { margin-top:8px; width:100%; }
  .tq-tbl th:first-child, .tq-tbl td:first-child { text-align:left; } .tq-tbl small { display:block; color:#7a7168; font-size:12px; }
  .sq-pcard { position:relative; overflow:hidden; background:#faf5ea; border-radius:12px; padding:12px; margin-top:10px; font-size:16px; }
  .sq-pcard::after { content:attr(data-wm); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform:rotate(-18deg); font-size:20px; font-weight:700; color:rgba(168,50,31,.10); pointer-events:none; white-space:nowrap; }
  .sq-pnum { font-size:18px; margin:6px 0; } .sq-pnum b { color:var(--red-d); }
  .sq-pcard ul { margin:6px 0 4px; padding-left:20px; }
  .dmq { margin-top:16px; border-top:1px dashed var(--line); padding-top:8px; }
  .dmq h3 { margin:6px 0 0; font-size:17px; }
  .dmq-out img { display:block; width:100%; border-radius:10px; border:1px solid var(--line); margin-top:10px; }
  footer { text-align:center; color:var(--mute); font-size:13px; margin-top:22px; }
</style>

<body>
<header>
  <div class="sub">巴拿巴宣教學院・國際志工募款</div>
  <h1>我的入口</h1>
</header>
<div class="wrap">

  <section id="vLoading" class="loading"><div class="spin"></div><div>載入中…</div></section>

  <section id="vFail" class="card" hidden>
    <h2>連不上系統</h2>
    <p>可能是網路不太穩，請再試一次。</p>
    <button type="button" class="btn" id="retry">重新載入</button>
  </section>

  <section id="vLogin" class="card" hidden>
    <h2>同學專用｜登入</h2>
    <label class="f" for="who">我的名字</label>
    <select id="who"></select>
    <label class="f" for="code">我的通關碼 <small>（每人一組，看 LINE 記事本）</small></label>
    <input type="password" id="code" inputmode="numeric" autocomplete="off" maxlength="12">
    <label class="chk"><input type="checkbox" id="remember"> 記住這支手機（下次免輸入）</label>
    <div class="err" id="err" hidden role="alert"></div>
    <button type="button" class="btn" id="go">查看我的訂單</button>
    <p class="hint" style="margin-top:12px">通關碼只有您自己的，請不要轉給別人。忘記請聯絡統籌<span class="coord-name"></span>。</p>
  </section>

  <section id="vMain" hidden>
    <div class="card">
      <div class="hello"><div><b id="hName"></b> 的預購總覽<div class="hint" id="hUpd"></div></div>
        <button type="button" class="link" id="logout">登出</button></div>
      <div class="tot" id="tot"></div>
      <div class="row"><button type="button" class="btn ghost small" id="refresh">重新整理</button><button type="button" class="g-btn" id="openGuide" style="justify-content:center">📖 操作說明</button></div>
    </div>

    <div class="card" id="vendorEntry" hidden>
      <h2>廠商專區</h2>
      <div class="hint">您是廠商負責人，可看跨三攤的出貨單與訂單明細。</div>
      <a class="btn" id="vendorGo" href="../vendor/">進入廠商專區</a>
    </div>

    <div class="card" id="boothEntry" hidden>
      <h2>各攤管理</h2>
      <div class="hint">您是組長／管理同學，可看本攤銷售、同學排行與利潤。</div>
      <a class="btn" id="boothGo" href="../booth/">進入各攤管理</a>
    </div>

    <div class="card" id="sheetEntry" hidden>
      <h2>📊 該組訂單試算表</h2>
      <div class="hint" id="sheetHint">您是本攤財務／統籌，可直接開啟試算表核對與編輯。</div>
      <div id="sheetLinks"></div>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="card" id="stallBox"></div>

    <div class="card lk" id="links"></div>

    <div class="card" id="acct">
      <h2>帳號設定</h2>
      <details id="pwBox"><summary>更改我的通關碼</summary>
        <label class="f" for="nc1">新通關碼 <small>（6～12 個英文字母或數字）</small></label>
        <input type="password" id="nc1" autocomplete="new-password" maxlength="12">
        <label class="f" for="nc2">再輸入一次</label>
        <input type="password" id="nc2" autocomplete="new-password" maxlength="12">
        <div class="err" id="pwErr" hidden role="alert"></div>
        <div class="ok" id="pwOk" hidden>已更改 ✓ 下次請用新的通關碼登入。</div>
        <button type="button" class="btn" id="pwGo">更改通關碼</button>
        <p class="hint" style="margin-top:10px">忘記通關碼時，請聯絡統籌<span class="coord-name"></span>協助重設。</p>
      </details>
    </div>
  </section>

  <footer>款項請依各攤約定交給負責同學；訂單內容如需更改，請聯絡統籌。</footer>
</div>

<script src="../settle.js"></script>
<script src="../guide_ui.js"></script>
  <script src="../phase1_fulfillment_ui.js"></script>
  <script src="../phase2_reconcile_ui.js"></script>
  <script src="../order_more_ui.js"></script>
  <script src="../dm_qr_ui.js"></script>
  <script src="../search_ui.js"></script>
  <script src="../item_ui.js"></script>
  <script src="../transfer_ui.js"></script>
  <script src="../health_ui.js"></script>
<script>
// ====== 設定（部署後只需要改這一行：整合查詢 API 的 /exec 網址）======
var API = window.CHIXIN_API_OVERRIDE || 'https://script.google.com/macros/s/AKfycbxLvSKMlFtjzn4BY1sh4_6-f4eIp9w6nNNbD3bcEahpkoaJmEUURhSG8KuVbLEAUjOU/exec';   // 2026/11/24：?test=1 時改走測試後端（env.js）
var BASE = 'https://nickwn1982.github.io/chixin/';      // GitHub Pages 根網址（第 1 攤）
var STALL_PATH = { s1: '', s2: 'nuan/', s3: 'bobo/' };    // 各攤的 GitHub Pages 路徑
var S3_READY = true;   // 第3攤 GitHub 訂購頁（bobo/）上線後，改成 true 才會顯示第3攤的專屬連結
var STALL_TITLE = { s1: '吃心絕對', s2: '天父的暖暖包', s3: '啵啵 快樂製造所' };

var $ = function (id) { return document.getElementById(id); };
var S = { data: null, tab: 's1', filter: 'all', sending: false };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '$' + String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function show(id) { ['vLoading', 'vFail', 'vLogin', 'vMain'].forEach(function (v) { $(v).hidden = v !== id; }); window.scrollTo(0, 0); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } }
function persisted() { try { return !!localStorage.getItem('cd'); } catch (e) { return false; } }

function api(body) {
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, 45000) : 0;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body),
    credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
          function (e) { clearTimeout(timer); throw e; });
}

function showErr(msg) { var el = $('err'); el.textContent = msg || ''; el.hidden = !msg; }

function fillNames(list, want, saved) {
  var pick = '';
  $('who').innerHTML = '<option value="">請選擇自己的名字</option>' + list.map(function (n) {
    if (want && n.slug && n.slug.toLowerCase() === want) pick = n.name;
    return '<option>' + esc(n.name) + '</option>';
  }).join('');
  pick = pick || saved || '';
  if (pick) $('who').value = pick;
  return pick;
}
function getCachedNames() {
  try { var x = JSON.parse(localStorage.getItem('chixin_names_v1') || 'null'); return Array.isArray(x) && x.length ? x : null; } catch (e) { return null; }
}
function swrKey(n) { return 'swr_my_' + n; }
function start() {
  var qs = new URLSearchParams(location.search), want = (qs.get('s') || '').trim().toLowerCase();
  var saved = load('nm'), savedCode = load('cd'), cached = getCachedNames();
  if (cached) {
    var pick = fillNames(cached, want, saved);
    if (savedCode && saved && (!pick || pick === saved)) {
      $('code').value = savedCode; $('remember').checked = persisted(); login(true, false); return;
    }
    show('vLogin');
    api({ action: 'names' }).then(function (r) { if (r && r.ok) { try { localStorage.setItem('chixin_names_v1', JSON.stringify(r.names)); } catch (e) {} fillNames(r.names, want, $('who').value || saved); } })['catch'](function () {});
    return;
  }
  if (saved && savedCode && !want) {
    $('who').innerHTML = '<option>' + esc(saved) + '</option>'; $('who').value = saved;
    $('code').value = savedCode; $('remember').checked = persisted(); login(true, false);
    api({ action: 'names' }).then(function (r) { if (r && r.ok) { try { localStorage.setItem('chixin_names_v1', JSON.stringify(r.names)); } catch (e) {} fillNames(r.names, want, saved); } })['catch'](function () {});
    return;
  }
  show('vLoading');
  api({ action: 'names' }).then(function (r) {
    if (!r || !r.ok) throw new Error('names');
    try { localStorage.setItem('chixin_names_v1', JSON.stringify(r.names)); } catch (e) {}
    var pick = fillNames(r.names, want, saved);
    if (savedCode && saved && (!pick || pick === saved)) { $('code').value = savedCode; $('remember').checked = persisted(); login(true, false); return; }
    show('vLogin');
  })['catch'](function (e) { if (window.console) console.error(e); show('vFail'); });
}

function login(auto, fresh) {
  var name = $('who').value, code = $('code').value.trim();
  if (!name || !code) { showErr('請選擇名字並輸入通關碼'); show('vLogin'); return; }
  if (S.sending) return; S.sending = true; showErr('');
  $('go').disabled = true; $('go').textContent = '查詢中…';
  var showedSwr = false;
  if (!fresh) {
    try {
      var c = JSON.parse(sessionStorage.getItem(swrKey(name)) || (persisted() ? localStorage.getItem(swrKey(name)) : null) || 'null');
      if (c && c.ok && c.name === name) {
        S.name = name; S.code = code; S.data = c; S.tab = S.tab || firstTab(c); S.led = c.led || null; if (c.batches) window.__p12MetaPrefill = c.batches;
        render(); $('hUpd').textContent = '資料時間 ' + c.updated + '（背景更新中…）'; show('vMain'); showedSwr = true;
      }
    } catch (e) {}
  }
  if (auto && !showedSwr) show('vLoading');
  api({ action: 'login', name: name, code: code, fresh: !!fresh }).then(function (r) {
    S.sending = false; $('go').disabled = false; $('go').textContent = '查看我的訂單';
    if (!r || !r.ok) {
      if (auto) { store('cd', null); try { sessionStorage.removeItem(swrKey(name)); localStorage.removeItem(swrKey(name)); } catch (e) {} }
      showErr((r && r.error) || '查詢失敗，請再試一次'); show('vLogin'); return;
    }
    if ($('remember').checked) { store('nm', name); store('cd', code); } else { store('nm', null); store('cd', null); }
    try { sessionStorage.setItem('nm', name); sessionStorage.setItem('cd', code); sessionStorage.setItem(swrKey(name), JSON.stringify(r)); } catch (e) {}
    try { if ($('remember').checked) localStorage.setItem(swrKey(name), JSON.stringify(r)); else localStorage.removeItem(swrKey(name)); } catch (e) {}
    if (r.batches) window.__p12MetaPrefill = r.batches;
    S.name = name; S.code = code; S.data = r; if (!showedSwr || !S.tab) S.tab = firstTab(r); S.filter = S.filter || 'all'; S.led = r.led || null;
    render(); show('vMain');
    if (window.GuideUI) GuideUI.renderFirstTimeTip($('vMain').firstElementChild, openMyGuide);
    if (!S.led) loadLedger();
  })['catch'](function (e) {
    S.sending = false; $('go').disabled = false; $('go').textContent = '查看我的訂單';
    if (window.console) console.error(e);
    if (showedSwr) { $('hUpd').textContent = '資料時間 ' + S.data.updated + '（更新失敗，顯示快取）'; return; }
    showErr('網路好像不太穩，請再按一次'); show('vLogin');
  });
}

Settle.init({ api: api, auth: function () { return { name: S.name, code: S.code }; } });

/** 收款狀態與結算（後端尚未更新時會失敗，畫面維持唯讀） */
function loadLedger() {
  Settle.call({ action: 'ledgerMine' }).then(function (r) { if (r && r.ok) { S.led = r; mountHealth(); renderSheetEntry(); renderStall(); mountSearch(); } })['catch'](function () {});
}
/** 更新物流／異常後就地重抓資料（不整頁重新載入；畫面、頁籤與捲動位置保留） */
function mountSearch() {
  if (!window.SearchUI || !window.chixinFeature || !chixinFeature('search')) return;
  var old = document.querySelectorAll('.sq'); for (var i=0;i<old.length;i++) old[i].remove();
  try { SearchUI.render($('links'), {state:S, api:api, auth:function(){return {name:S.name, code:S.code};}, onPhone:softRefresh}); } catch(e) { console.error(e); }
}
function mountHealth() {   // 2026/11/26 系統自我檢測：統籌／組長／財務才出現
  var L = S.led || {};
  if (!window.HealthUI || !window.chixinFeature || !chixinFeature('health') || document.querySelector('.hc')) return;
  if (!((L.financeOf || []).length || (L.editorOf || []).length)) return;

/** 本機改了某筆狀態後，重算畫面上的小計（之後 loadLedger 會再跟伺服器對齊） */
function recalc() {
  var keys = ['count', 'qty', 'amount', 'paidAmount', 'unpaidAmount', 'handedAmount', 'deliveredCount', 'pendingCount'], t = {};
  keys.forEach(function (k) { t[k] = 0; });
  S.data.stalls.forEach(function (st) {
    var s = { cancelledCount: 0 }; keys.forEach(function (k) { s[k] = 0; });
    st.orders.forEach(function (o) {
      if (o.cancelled) { s.cancelledCount++; return; }
      s.count++; s.qty += o.qty; s.amount += o.amount;
      if (o.paid) s.paidAmount += o.amount; else s.unpaidAmount += o.amount;
      if (o.handed) s.handedAmount += o.amount;
      if (o.delivered) s.deliveredCount++; else s.pendingCount++;
    });
    st.summary = s; keys.forEach(function (k) { t[k] += s[k]; });
  });
  S.data.total = t;
}

function copyText(text, btn) {
  function done() { btn.textContent = '已複製 ✓'; setTimeout(function () { btn.textContent = '複製連結'; }, 2000); }
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = '請長按上方連結複製'; } document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function changeCode() {

<script>
(function(){
  var _metaCache = {};
  function mountSlots(slots, batches){
    slots.forEach(function(el){
      if (el.getAttribute('data-init') === '1') return;
      el.setAttribute('data-init', '1');
      if (el.getAttribute('data-cancelled') === '1') return;
      var ord = { id: el.getAttribute('data-oid'), delivered: el.getAttribute('data-delivered') === '1', batchCode: el.getAttribute('data-batch') || '', logisticsState: el.getAttribute('data-logi') || '' };   // 2026/11/23：帶入目前梯次／物流，修正選完又跳回預設
      var st = el.getAttribute('data-stall') || 's1';
      var upd = function(){ if (window.softRefresh) softRefresh(); else location.reload(); };
      if (window.OrderMoreUI && window.chixinFeature && chixinFeature('ui2')) { OrderMoreUI.render(el, { stall: st, order: ord, batches: batches, apiCall: Settle.call, onUpdated: upd }); return; }   // 2026/11/26 新版樣式（測試中）
      FulfillmentUI.renderOrderControls(el, { stall: st, order: ord, batches: batches, apiCall: Settle.call, onUpdated: upd });
      ReconcileUI.renderOrderSplitAndFlag(el, { stall: st, order: ord, apiCall: Settle.call, onUpdated: upd });
    });
  }
  function hydrateSlots(){
    if (!window.FulfillmentUI || !window.ReconcileUI || !window.Settle) return;
    var slots = document.querySelectorAll('.p12-order-slot:not([data-init])');
    if (!slots.length) return;
    var stall = slots[0].getAttribute('data-stall') || 's1';
    if (_metaCache[stall]) { mountSlots(slots, _metaCache[stall]); return; }
    var pre = window.__p12MetaPrefill && window.__p12MetaPrefill[stall];   // 登入時已一併帶回梯次，免再呼叫一次
    if (pre) { _metaCache[stall] = pre; mountSlots(slots, pre); return; }
    if (_metaCache[stall] === false) return;
    _metaCache[stall] = false;
    Settle.call({ action: 'fulfillmentMeta', stall: stall }).then(function(meta){
      var batches = (meta && meta.batches) || [];
      _metaCache[stall] = batches;
      mountSlots(document.querySelectorAll('.p12-order-slot:not([data-init])'), batches);
    }).catch(function(){ delete _metaCache[stall]; });
  }
  new MutationObserver(hydrateSlots).observe(document.body, { childList: true, subtree: true });
})();
</script>

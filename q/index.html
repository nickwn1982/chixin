<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><script src="../env.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<meta name="robots" content="noindex,nofollow">
<title>查我的訂單｜巴拿巴宣教學院募款</title>
<style>
  :root { --red:#a8321f; --red-d:#7f2416; --cream:#fbf6ec; --ink:#2e2a26; --mute:#7a7168; --line:#e4d8c4; --green:#2f6b4f; --gold:#c8963e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; font-size:18px; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 48px; }
  header { background:var(--red); color:#fff; padding:20px 16px 16px; text-align:center; border-bottom:5px solid var(--gold); }
  header .sub { font-size:14px; opacity:.92; letter-spacing:.08em; }
  header h1 { margin:4px 0 0; font-size:24px; line-height:1.3; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; }
  label { display:block; font-weight:700; margin:12px 0 4px; }
  label small { font-weight:400; color:var(--mute); }
  input { width:100%; font:inherit; padding:12px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, button:focus-visible { outline:3px solid #e9b949; outline-offset:1px; }
  .btn { display:block; width:100%; font:inherit; font-size:20px; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--red); color:#fff; cursor:pointer; margin-top:16px; }
  .btn:disabled { opacity:.55; }
  .hint { color:var(--mute); font-size:15px; }
  .err { color:var(--red-d); background:#fff4f1; border:1px solid #f0c9bf; border-radius:10px; padding:10px; margin-top:12px; }
  .ord { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; background:#fff; }
  .ord.x { opacity:.55; }
  .ord .top { display:flex; justify-content:space-between; gap:8px; font-weight:700; }
  .ord .meta { color:var(--mute); font-size:14px; }
  .tag { display:inline-block; font-size:14px; padding:2px 10px; border-radius:999px; margin:6px 6px 0 0; background:#efe7d8; }
  .tag.ok { background:#e3f1e8; color:var(--green); } .tag.no { background:#fde6e1; color:var(--red-d); }
</style>
</head>
<body>
<header><div class="sub">巴拿巴宣教學院募款・三攤聯合團購</div><h1>查我的訂單</h1></header>
<div class="wrap">
  <div class="card">
    <div class="hint">輸入下單時填的手機和訂購人姓名，就能看到你在三攤的所有訂單、付款和交貨狀況。</div>
    <label for="ph">手機 <small>09 開頭 10 碼</small></label>
    <input id="ph" type="tel" inputmode="numeric" maxlength="12" placeholder="09xxxxxxxx" autocomplete="tel">
    <label for="nm">訂購人姓名 <small>和下單時填的一樣</small></label>
    <input id="nm" type="text" maxlength="30" placeholder="例：王小明" autocomplete="name">
    <button id="go" class="btn" type="button">查詢</button>
    <div id="msg" class="err" role="status" hidden></div>
  </div>
  <div id="out"></div>
  <p class="hint" style="margin-top:18px">訂單有問題，請聯絡介紹你的同學。查錯太多次會暫停 10 分鐘。</p>
</div>
<script>
(function () {
  var API = window.CHIXIN_API_OVERRIDE || 'https://script.google.com/macros/s/AKfycbxLvSKMlFtjzn4BY1sh4_6-f4eIp9w6nNNbD3bcEahpkoaJmEUURhSG8KuVbLEAUjOU/exec';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '$' + String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function msg(t) { $('msg').hidden = !t; $('msg').textContent = t || ''; }
  function go() {
    var phone = $('ph').value.trim(), buyer = $('nm').value.trim();
    msg(''); $('out').innerHTML = '';
    if (!/^0?9\d{8}$/.test(phone.replace(/\D/g, ''))) { msg('手機請填 09 開頭 10 碼'); return; }
    if (!buyer) { msg('請填訂購人姓名'); return; }
    $('go').disabled = true; $('go').textContent = '查詢中…';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'buyerLookup', phone: phone, buyer: buyer }), credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        $('go').disabled = false; $('go').textContent = '查詢';
        if (!r || !r.ok) { msg((r && r.error) || '查詢失敗，請稍後再試'); return; }
        if (!r.orders.length) { msg(r.message || '查無訂單'); return; }
        $('out').innerHTML = r.orders.map(function (o) {
          return '<div class="ord' + (o.cancelled ? ' x' : '') + '"><div class="top"><span>' + esc(o.booth + '｜' + o.stallName) + '</span><span>' + money(o.amount) + '</span></div>' +
            '<div class="meta">' + esc(o.id) + '・' + esc(o.time) + '・介紹同學 ' + esc(o.seller) + '</div>' +
            '<div>' + esc(o.content) + '</div><div class="hint">取貨：' + esc(o.pickup) + '</div>' +
            (o.cancelled ? '<span class="tag no">已取消</span>' : '<span class="tag ' + (o.paid ? 'ok">已付款' : 'no">尚未付款') + '</span><span class="tag ' + (o.delivered ? 'ok">已交貨' : '">' + esc(o.logistics || '待交貨')) + '</span>') + '</div>';
        }).join('');
      }, function () { $('go').disabled = false; $('go').textContent = '查詢'; msg('網路不穩，請再按一次'); });
  }
  $('go').addEventListener('click', go);
  $('nm').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前往訂單試算表…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #f6f1e7; color: #3a2b20; text-align: center;
    }
    .box {
      max-width: 360px; width: 100%; background: #fff; padding: 24px;
      border-radius: 16px; border: 1px solid #e7dfd1;
    }
    .btn {
      display: inline-block; margin-top: 14px; padding: 10px 20px;
      border-radius: 10px; border: 1.5px solid #2b6b45; color: #2b6b45;
      background: #fff; text-decoration: none; font-weight: 600;
    }
    .muted { color: #6e6257; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box" id="status">正在開啟訂單試算表…</div>
  <script>
    (function () {
      const SHEET_MAP = {
        '1': {
          name: '第1攤 吃心絕對 訂單試算表',
          url: 'https://docs.google.com/spreadsheets/d/1Wg4fqZCf7qoMWno9rBU8CTLtOyXzbdCVq6nyO18NYF0/edit'
        },
        '2': {
          name: '第2攤 天父的暖暖包 訂購單試算表',
          url: 'https://docs.google.com/spreadsheets/d/1rWiP9HcPxKnH6bdJaNXg4wXcanoB-Ndq7dXIdJ8wtko/edit'
        },
        '3': {
          name: '第3攤 啵啵 快樂製造所 訂購單試算表',
          url: 'https://docs.google.com/spreadsheets/d/1H7hoko3RH1Gr8vqL79uagLSa-tOw4OzHeFa5GCUZ9Xo/edit'
        }
      };

      const key = (new URLSearchParams(location.search).get('s') || '').trim().replace(/^s/i, '');
      const target = SHEET_MAP[key];
      const box = document.getElementById('status');

      if (!target) {
        box.innerHTML = '<strong>找不到對應的訂單試算表</strong><p class="muted">請確認連結參數為 ?s=1、?s=2 或 ?s=3。</p>';
        return;
      }

      box.innerHTML =
        `<div>正在前往 <strong>${target.name}</strong>…</div>` +
        `<a class="btn" href="${target.url}">若未自動跳轉請點此開啟</a>`;
      location.replace(target.url);
    })();
  </script>
</body>
</html>
